# Nginx decoy — маскировочный сайт на Fast VM
# Устанавливается на порту 80; на 443 слушает Xray (Reality).
# Если Reality не подключён, curl к :443 покажет обычный сайт через fallback.

server {
    listen 80;
    listen [::]:80;
    server_name vm.example.com;

    root /var/www/decoy;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# Reality fallback: если клиент не прошёл Reality handshake,
# Xray отдаёт dest (yandex.ru:443). Этот блок — для прямых HTTP-запросов.
